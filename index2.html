.love-layer {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 12px 12px 0;
  pointer-events: none;
  z-index: 50;
}

.love-card {
  pointer-events: auto;
  width: min(92vw, 480px);
  max-height: calc(100dvh - 80px);
  overflow-y: auto;
  padding: 1.4rem 1.2rem 1.6rem;
  border-radius: 20px;
  background: rgba(10, 10, 20, 0.6);
  border: 1px solid rgba(255, 240, 150, 0.28);
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.55),
    inset 0 0 40px rgba(255, 240, 150, 0.04);
  backdrop-filter: blur(14px) saturate(120%);
  -webkit-backdrop-filter: blur(14px) saturate(120%);
  text-align: center;
  font-family: "Georgia", "Times New Roman", serif;
  color: #fff;
  opacity: 0;
  animation: loveFadeIn 1.8s 5.2s forwards;
  -webkit-overflow-scrolling: touch;
}

.love-card.is-hidden {
  opacity: 0 !important;
  visibility: hidden;
  pointer-events: none;
  animation: none !important;
}

@keyframes loveFadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.love-title {
  font-size: clamp(1.8rem, 6.5vw, 3rem);
  font-weight: 400;
  letter-spacing: 0.12em;
  margin-bottom: 0.35em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.25em;
  text-shadow: 0 0 20px rgba(255, 240, 150, 0.8),
               0 0 40px rgba(255, 200, 0, 0.4);
}
.love-title__heart {
  color: #ff4d6d;
  animation: heartBeat 1.2s ease-in-out infinite;
  display: inline-block;
  filter: drop-shadow(0 0 10px rgba(255, 77, 109, 0.8));
}

.love-names {
  font-size: clamp(1rem, 3.2vw, 1.3rem);
  letter-spacing: 0.16em;
  color: #ffe9a8;
  margin-bottom: 1.2em;
}
.love-names__amp {
  color: #ff4d6d;
  margin: 0 0.3em;
}

.love-counter {
  display: flex;
  flex-direction: column;
  gap: 0.3em;
  margin-bottom: 1.2em;
}
.love-counter__label {
  font-size: clamp(0.7rem, 2.2vw, 0.9rem);
  letter-spacing: 0.22em;
  opacity: 0.75;
  text-transform: uppercase;
}
.love-counter__seconds {
  font-size: clamp(1.8rem, 8vw, 3rem);
  color: #fff;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  text-shadow:
    0 0 18px rgba(255, 240, 150, 0.75),
    0 0 40px rgba(255, 200, 0, 0.35);
  letter-spacing: 0.02em;
  word-break: break-word;
}
.love-counter__seconds small {
  font-size: 0.4em;
  letter-spacing: 0.2em;
  opacity: 0.85;
  margin-left: 0.25em;
  text-transform: uppercase;
}

.love-btn {
  pointer-events: auto;
  cursor: pointer;
  background: rgba(255, 240, 150, 0.1);
  border: 1px solid rgba(255, 240, 150, 0.55);
  color: #ffe9a8;
  font-family: inherit;
  font-size: clamp(0.85rem, 2.4vw, 1rem);
  letter-spacing: 0.16em;
  padding: 0.8em 1.5em;
  border-radius: 999px;
  transition: all 0.3s ease;
  box-shadow: 0 0 20px rgba(255, 240, 150, 0.15);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.love-btn:hover,
.love-btn:focus-visible {
  background: rgba(255, 240, 150, 0.2);
  border-color: #ffe9a8;
  box-shadow: 0 0 30px rgba(255, 240, 150, 0.45);
  transform: translateY(-2px);
  outline: none;
}
.love-btn:active { transform: scale(0.97); }

.love-secret {
  margin-top: 1em;
  font-size: clamp(0.9rem, 2.5vw, 1.1rem);
  letter-spacing: 0.04em;
  color: #ff9eb5;
  line-height: 1.5;
  opacity: 0;
  transition: opacity 0.7s ease;
  text-shadow: 0 0 18px rgba(255, 77, 109, 0.55);
  min-height: 1.5em;
}
.love-secret.is-visible { opacity: 1; }

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  15%      { transform: scale(1.25); }
  30%      { transform: scale(1); }
  45%      { transform: scale(1.15); }
  60%      { transform: scale(1); }
}

/* Lluvia de corazones */
.heart-rain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 60;
  overflow: hidden;
}
.heart-rain span {
  position: absolute;
  top: -5vh;
  font-size: 1.5rem;
  color: #ff4d6d;
  animation: heartFall linear forwards;
  filter: drop-shadow(0 0 6px rgba(255, 77, 109, 0.7));
}
@keyframes heartFall {
  0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

/* ===== Botón flotante para ocultar/mostrar tarjeta ===== */
.toggle-card-btn {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 70;
  cursor: pointer;
  pointer-events: auto;
  background: rgba(10, 10, 20, 0.75);
  border: 1px solid rgba(255, 240, 150, 0.45);
  color: #ffe9a8;
  font-family: "Georgia", "Times New Roman", serif;
  font-size: clamp(0.75rem, 2.2vw, 0.9rem);
  letter-spacing: 0.08em;
  padding: 0.55em 0.95em;
  border-radius: 999px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  transition: all 0.25s ease;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
  touch-action: manipulation;
}
.toggle-card-btn:hover,
.toggle-card-btn:focus-visible {
  background: rgba(255, 240, 150, 0.18);
  border-color: #ffe9a8;
  transform: translateY(-1px);
  outline: none;
}
.toggle-card-btn:active { transform: scale(0.97); }

/* ===== Responsive ===== */
@media (max-width: 700px), (max-height: 750px) {
  .love-layer { padding: 8px 8px 0; }
  .love-card {
    width: 95vw;
    padding: 1rem 0.9rem 1.2rem;
    border-radius: 16px;
    max-height: calc(100dvh - 70px);
  }
  .love-title { letter-spacing: 0.06em; margin-bottom: 0.25em; }

  .love-counter { margin-bottom: 0.9em; gap: 0.2em; }
  .love-counter__label { letter-spacing: 0.15em; }
  .love-counter__seconds { letter-spacing: 0; }
  .love-btn { padding: 0.7em 1.3em; letter-spacing: 0.12em; }
  .toggle-card-btn { top: 8px; right: 8px; padding: 0.45em 0.8em; }
}

@media (max-height: 640px) {

  .love-title { font-size: clamp(1.4rem, 6vw, 2rem); }
  .love-counter__seconds { font-size: clamp(1.4rem, 7vw, 2.2rem); }
  .love-secret { font-size: 0.85rem; }

  <script>
  (function() {
    const toggleBtn = document.getElementById("toggleCardBtn");
    const loveCard  = document.getElementById("loveCard");

    toggleBtn.addEventListener("click", () => {
      const hidden = loveCard.classList.toggle("is-hidden");
      toggleBtn.textContent = hidden ? "Ver tarjeta 💌" : "Ver flores 🌸";
      toggleBtn.setAttribute("aria-pressed", String(hidden));
    });
  })();

  (function() {
    // Fecha de inicio: hace 2 días (ajusta hora exacta si quieres)
    const FECHA_INICIO = new Date(
      new Date().getFullYear(),
      new Date().getMonth(),
      new Date().getDate() - 2,
      0, 0, 0
    );

    const secondsEl = document.getElementById("loveSeconds");

    function formatearNumero(n) {
      return n.toLocaleString("es-ES");
    }

    function actualizarContador() {
      const ahora = new Date();
      let diff = ahora - FECHA_INICIO;
      if (diff < 0) diff = 0;

      const totalSeg = Math.floor(diff / 1000);
      secondsEl.innerHTML = `${formatearNumero(totalSeg)} <small>seg</small>`;
    }
    actualizarContador();
    setInterval(actualizarContador, 1000);

    const MENSAJES = [
      "Eres mi persona favorita en todo el universo. ✨",
      "Cada día contigo es mi día favorito. 💛",
      "Gracias por existir y por elegirme. 🌙",
      "Te amo más de lo que estas flores pueden decir. 🌸",
      "Eres mi lugar seguro. 🏡",
      "Contigo hasta el infinito y más allá. 💫",
      "Mi corazón late en tu nombre, Bárbara. ❤️",
      "No hay noche que no quiera pasar contigo. 🌌",
      "Dos días y ya no imagino mi vida sin ti. 🥰",
      "Carlos + Bárbara = para siempre. 💞"
    ];

    const btn = document.getElementById("loveBtn");
    const secretEl = document.getElementById("loveSecret");
    const rainEl = document.getElementById("heartRain");
    let ultimoIndice = -1;

    btn.addEventListener("click", () => {
      let i;
      do { i = Math.floor(Math.random() * MENSAJES.length); }
      while (i === ultimoIndice && MENSAJES.length > 1);
      ultimoIndice = i;

      secretEl.textContent = MENSAJES[i];
      secretEl.classList.add("is-visible");
      clearTimeout(secretEl._t);
      secretEl._t = setTimeout(() => secretEl.classList.remove("is-visible"), 6500);

      lanzarCorazones(26);
    });

    function lanzarCorazones(cantidad) {
      for (let n = 0; n < cantidad; n++) {
        const h = document.createElement("span");
        h.textContent = Math.random() < 0.5 ? "❤" : "💛";
        h.style.left = Math.random() * 100 + "vw";
        h.style.fontSize = (1 + Math.random() * 1.8) + "rem";
        const dur = 3 + Math.random() * 3;
        h.style.animationDuration = dur + "s";
        h.style.animationDelay = (Math.random() * 0.8) + "s";
        rainEl.appendChild(h);
        setTimeout(() => h.remove(), (dur + 1) * 1000);
      }
    }
  })();
